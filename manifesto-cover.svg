<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" role="img" aria-labelledby="title desc">
  <title id="title">Egoless Programming in the Agentic Age</title>
  <desc id="desc">A typographic manifesto: intelligence has no privileged origin. Judge the code, not the coder's origin.</desc>
  <style>
    svg { color: #111; }
    .accent { fill: #b63825; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      .accent { fill: #ff7b72; }
    }
  </style>
  <g fill="currentColor" font-family="Georgia, 'Times New Roman', serif">
    <text x="48" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">EGOLESS.AGENCY</text>
    <text x="752" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">A MANIFESTO / 01—10</text>
    <path d="M48 75H752" stroke="currentColor" stroke-width="2"/>
    <text x="48" y="133" font-size="22" font-style="italic">On programming in the agentic age</text>
    <text x="45" y="251" font-size="105" font-weight="700" letter-spacing="-6">Egoless</text>
    <text x="45" y="354" font-size="92" font-weight="700" letter-spacing="-5">Programming<tspan class="accent">.</tspan></text>
    <path d="M48 390H752" stroke="currentColor" stroke-width="8"/>
    <text x="48" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">THE PREMISE</text>
    <text x="48" y="507" font-size="37">Intelligence has no</text>
    <text x="48" y="553" font-size="37" font-style="italic">privileged origin.</text>
    <text x="48" y="626" font-family="Arial, sans-serif" font-size="17">Collective intelligence over individual ego.</text>
    <path d="M48 675H752" stroke="currentColor" stroke-width="2"/>
    <text x="48" y="720" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">TEN PRINCIPLES</text>
    <text x="48" y="762" font-size="27">Judge the code. Not the coder’s origin.</text>
    <text x="48" y="815" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">OPEN SOURCE. OPEN TO CHALLENGE.</text>
    <text x="752" y="815" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CC0 1.0</text>
  </g>
</svg>
